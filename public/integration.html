<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8"/>
    <title>Local Trip Planner - Ardèche</title>

    <base href="/"/>

    <meta name="color-scheme" content="light dark"/>
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <meta name="format-detection" content="telephone=no"/>
    <meta name="msapplication-tap-highlight" content="no"/>
    <meta http-equiv="Content-Security-Policy" content="frame-src 'self' https://ltp.ardeche.apitour.fr"/>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Roboto", sans-serif;
        }
    </style>
</head>

<body>
<div id="test_btn" style="position: absolute; z-index: 999; top: 20px; left: 20px;">
  <button type="button" onclick="openLTP(this)" data-ltp-config="eyJtYWluIjoiIzMzNDQ1NSIsImFsdCI6IiM0NDU1NjYiLCJ0ZXh0IjoiIzU1NjY3NyIsImJnIjoiIzY2Nzc4OCIsImZvbnQiOiJSb2JvdG8iLCJtb2RlcyI6WyJ0cmFuc2l0IiwiYmlrZSIsImJpY3ljbGUiLCJjYXIiXX0=">J'y vais !</button>
</div>

<noscript>Please enable JavaScript to continue using this application.</noscript>
<script>
    // let cfg = {main:'#334455',alt:'#445566',text:'#556677',bg:'#667788',font:'Roboto',modes:['transit','bike','bicycle','car']}
    // let encodedCfg = "eyJtYWluIjoiIzMzNDQ1NSIsImFsdCI6IiM0NDU1NjYiLCJ0ZXh0IjoiIzU1NjY3NyIsImJnIjoiIzY2Nzc4OCIsImZvbnQiOiJSb2JvdG8iLCJtb2RlcyI6WyJ0cmFuc2l0IiwiYmlrZSIsImJpY3ljbGUiLCJjYXIiXX0="
    function openLTP(elt, fromPlace = '44.61975,4.38822', toPlace = '44.73471,4.59783') {
      const previousLtp = document.querySelector('#ltp_container');
      if (previousLtp) {
        previousLtp.remove();
      }
      const config = elt.getAttribute('data-ltp-config');
      if (config) {
        const cfg = JSON.parse(atob(config));
        const ltpUrl = `http://localhost:9966/#/?ui_activeSearch=&fromPlace=${fromPlace}&toPlace=${toPlace}&arriveBy=false&mode=WALK,TRANSIT&numItineraries=3&modeButtons=${cfg.modes.join('_')}&config=${config}`;
        const ltpContainer =
          `<div id="ltp_container" class="ltp_modal">
            <div id="ltp_wrapper">
              <button id="ltp_close" onclick="closeLTP()" class="modal-close">Fermer</button>
              <iframe id="ltp_main" allow="geolocation" style="width: 100%; height: 100%; border: none;" src="${encodeURI(ltpUrl)}"></iframe>
            </div>
          </div>`;
        const modalStyles = `<style>
          .ltp_modal {
              position: fixed;
              background-color: rgba(0, 0, 0, 0.75);
              top: 0;
              right: 0;
              bottom: 0;
              left: 0;
              z-index: 999;
              visibility: visible;
              content: 'ltp_styles';
          }
          .ltp_modal > div {
              width: 80vw;
              height: 75vh;
              position: absolute;
              top: 50%;
              left: 50%;
              transform: translate(-50%, -50%);
              background: white;
              overflow: hidden;
              border-radius: 5px;
          }
          .ltp_modal header {
              font-weight: bold;
          }
          .ltp_modal h1 {
              font-size: 150%;
              margin: 0 0 15px;
          }

          .ltp_modal .modal-close {
              color: #aaa;
              line-height: 50px;
              font-size: 80%;
              position: absolute;
              right: 0;
              text-align: center;
              top: 0;
              width: 70px;
              text-decoration: none;
              &:hover {
                  color: black;
              }
          }
        </style>`;
        if (document.head.innerText.indexOf("content: 'ltp_styles'") === -1) {
          document.head.insertAdjacentHTML('beforeend', modalStyles);
        }
        document.body.insertAdjacentHTML('beforeend', ltpContainer);
      }
    }

    function closeLTP() {
        const container = document.querySelector("#ltp_container");
        container.remove();
        // container.classList.remove("active");
        // const previousLtp = container.querySelector("#ltp_main");
        // if (previousLtp) {
        //     previousLtp.remove();
        // }
        history.replaceState(null, "", "integration.html");
    }
</script>
</body>
</html>
